[elarion_rx868]
extends = stm32_base
board = nucleo_l432kc
board_upload.maximum_size = 229376
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
lib_ignore = SubGhz
build_flags = ${stm32_base.build_flags}
  -I variants/elarion
  -include variants/elarion/elarion_prefix.h
  -D RADIOLIB_EXCLUDE_STM32WLX=1
  -D FLASH_END_ADDR=0x0803FFFF
  -D SERIAL_UART_INSTANCE=1
  -D PIN_SERIAL_TX=PB6
  -D PIN_SERIAL_RX=PB7
  -D RADIO_CLASS=ElarionSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D P_LORA_NSS=PA4
  -D P_LORA_RESET=PA15
  -D P_LORA_DIO_0=PA11
  -D P_LORA_DIO_1=PA12
  -D P_LED_TX=PA2
  -D SX1276_MAX_DRIVE_DBM=20
  -D LORA_TX_POWER=20
  -D ELARION_BOARD_NAME='"Elarion RX868"'
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/elarion>

[env:elarion_rx868_repeater]
extends = elarion_rx868
build_flags = ${elarion_rx868.build_flags}
  -D ADVERT_NAME='"Elarion Repeater"'
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${elarion_rx868.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
