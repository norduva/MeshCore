[elarion_tx868]
extends = stm32_base
board = nucleo_l432kc
board_upload.maximum_size = 229376
lib_deps = ${arduino_base.lib_deps}
  file://arch/stm32/Adafruit_LittleFS_stm32
lib_ignore = SubGhz
build_flags = ${stm32_base.build_flags}
  -I variants/elarion
  -include variants/elarion/elarion_prefix.h
  -D RADIOLIB_EXCLUDE_STM32WLX=1
  -D FLASH_END_ADDR=0x0803FFFF
  -D SERIAL_UART_INSTANCE=1
  -D PIN_SERIAL_TX=PB6
  -D PIN_SERIAL_RX=PB7
  -D RADIO_CLASS=ElarionSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=8
  -D P_LORA_NSS=PC15
  -D P_LORA_RESET=PA15
  -D P_LORA_DIO_0=PA11
  -D P_LORA_DIO_1=PA12
  -D P_LED_TX=PA8
  -D P_PA_DAC=PA4
  -D PA_DAC_VALUE=3351
  -D P_MUX_S1=PB5
  -D P_MUX_S2=PB4
  -D P_MUX_S3=PB3
  -D P_RS485_DE=PA10
  -D SX1276_MAX_DRIVE_DBM=2
  -D LORA_TX_POWER=2
  -D MAX_LORA_TX_POWER=2
  -D ELARION_BOARD_NAME='"Elarion TX868"'
build_src_filter = ${stm32_base.build_src_filter}
  +<../variants/elarion>

[env:elarion_tx868_companion_usb]
extends = elarion_tx868
build_flags = ${elarion_tx868.build_flags}
  -I examples/companion_radio/ui-orig
  -D MAX_CONTACTS=100
  -D MAX_GROUP_CHANNELS=8
  -D DISPLAY_CLASS=NullDisplayDriver
  -D ENABLE_USB_INTERFACE
build_src_filter = ${elarion_tx868.build_src_filter}
  +<helpers/ui/NullDisplayDriver.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-orig/*.cpp>
lib_deps = ${elarion_tx868.lib_deps}
  densaugeo/base64 @ ~1.4.0
